<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrustSeal</title>
  <script>
    // SPA GitHub Pages redirect — stores the current path and redirects to root
    // The main index.html will read sessionStorage and restore the URL
    var path = location.pathname + location.search + location.hash
    sessionStorage.setItem('spa_redirect', path)
    location.replace('/')
  </script>
</head>
<body></body>
</html>
